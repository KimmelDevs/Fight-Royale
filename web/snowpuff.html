<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snowpuff 3D</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(120% 90% at 50% 38%, #e3e9f4, #98a4bb); overflow: hidden; font-family: system-ui, sans-serif; }
  #c { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #c:active { cursor: grabbing; }
  .hint { position: fixed; left: 0; right: 0; bottom: 14px; margin: 0; text-align: center; font-size: 13px; color: #3c4358; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p class="hint">Drag to orbit · scroll to zoom · click to make it hop</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* =====================================================================
   SNOWPUFF  (Three.js r128)
   ---------------------------------------------------------------------
   Copy createSnowpuff() into your game. Usage:

     var pet = createSnowpuff(THREE);
     scene.add(pet.group);        // origin is at its feet, it faces +Z
     // every frame:
     pet.update(deltaSeconds);
     // on an event:
     pet.hop();

   Needs lights (see the demo at the bottom for a setup that suits the
   cartoon shading). Idle animation: breathing, head sway, ear flicks,
   arm swing, blinking and a flowing blue wisp scarf.
   ===================================================================== */
function createSnowpuff(T, opts) {
  'use strict';
  opts = opts || {};
  var Vector3 = T.Vector3, Color = T.Color, Group = T.Group, Mesh = T.Mesh, TAU = Math.PI * 2;
  function sstep(a, b, x) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function col(h) { return new Color(h); }

  /* ---- cel shading + outline materials ---- */
  var gradient = new T.DataTexture(new Uint8Array([120, 170, 215, 255]), 4, 1, T.LuminanceFormat);
  gradient.minFilter = gradient.magFilter = T.NearestFilter;
  gradient.generateMipmaps = false;
  gradient.needsUpdate = true;
  var furMat = new T.MeshToonMaterial({ vertexColors: true, gradientMap: gradient });
  var lineMat = new T.MeshBasicMaterial({ color: 0x4c5270, side: T.BackSide });
  function toon(hex) { return new T.MeshToonMaterial({ color: hex, gradientMap: gradient }); }

  /* ---- colours ---- */
  var FUR = col('#fcfcff'), SHADE = col('#c9cfe8'), INNER = col('#d9d3f0'), FOOT = col('#d3d7ea');
  function furCol(d, out) {
    out.copy(FUR).lerp(SHADE, Math.min(1, sstep(0.1, -0.9, d.y) * 0.55 + sstep(0.2, -0.9, d.z) * 0.15));
    return out;
  }
  function flat(hex) { var c0 = col(hex); return function (d, out) { return out.copy(c0); }; }

  /* ---- blobby ellipsoid with optional pear taper ---- */
  function blob(radii, colorFn, taper, w, h) {
    var base = new T.SphereGeometry(1, w || 32, h || 22);
    var pos = base.attributes.position, n = pos.count;
    var P = new Float32Array(n * 3), N = new Float32Array(n * 3), C = new Float32Array(n * 3);
    var c = new Color(), d = new Vector3(), nn = new Vector3();
    for (var i = 0; i < n; i++) {
      d.set(pos.getX(i), pos.getY(i), pos.getZ(i)).normalize();
      var k = (taper && d.y < 0) ? 1 + taper * (-d.y) : 1;
      P[i * 3] = d.x * radii.x * k; P[i * 3 + 1] = d.y * radii.y; P[i * 3 + 2] = d.z * radii.z * k;
      nn.set(d.x / radii.x, d.y / radii.y, d.z / radii.z).normalize();
      N[i * 3] = nn.x; N[i * 3 + 1] = nn.y; N[i * 3 + 2] = nn.z;
      colorFn(d, c); C[i * 3] = c.r; C[i * 3 + 1] = c.g; C[i * 3 + 2] = c.b;
    }
    base.setAttribute('position', new T.BufferAttribute(P, 3));
    base.setAttribute('normal', new T.BufferAttribute(N, 3));
    base.setAttribute('color', new T.BufferAttribute(C, 3));
    return base;
  }
  function outlineGeo(g, thick) {
    var o = g.clone(), p = o.attributes.position, nr = o.attributes.normal;
    for (var i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) + nr.getX(i) * thick, p.getY(i) + nr.getY(i) * thick, p.getZ(i) + nr.getZ(i) * thick);
    p.needsUpdate = true;
    return o;
  }
  // a shaded mesh plus its dark outline shell
  function part(geo, mat, thick) {
    var g = new Group();
    g.add(new Mesh(geo, mat));
    if (thick > 0) g.add(new Mesh(outlineGeo(geo, thick), lineMat));
    return g;
  }
  function R(x, y, z) { return new Vector3(x, y, z); }

  /* ================= build ================= */
  var group = new Group();      // yours: position / rotate / scale this (origin = feet on the ground)
  var rig = new Group();        // animated inner group
  rig.position.y = 0.38;
  group.add(rig);

  // body
  var body = part(blob(R(0.52, 0.58, 0.46), furCol, 0.22, 40, 28), furMat, 0.02);
  body.position.set(0, 0.28, 0); rig.add(body);

  // tail
  var tail = part(blob(R(0.15, 0.15, 0.15), furCol, 0, 20, 14), furMat, 0.012);
  tail.position.set(0, 0.02, -0.5); rig.add(tail);

  // feet
  [-1, 1].forEach(function (s) {
    var foot = part(blob(R(0.17, 0.1, 0.22), flat('#d3d7ea'), 0, 24, 16), furMat, 0.014);
    foot.position.set(s * 0.26, -0.28, 0.14); rig.add(foot);
    [-0.07, 0.07].forEach(function (tx) {
      var toe = part(blob(R(0.05, 0.04, 0.05), flat('#b5bad6'), 0, 12, 8), furMat, 0.008);
      toe.position.set(s * 0.26 + tx, -0.3, 0.34); rig.add(toe);
    });
  });

  // arms
  var arms = [];
  [-1, 1].forEach(function (s) {
    var pivot = new Group(); pivot.position.set(s * 0.5, 0.52, 0.06); rig.add(pivot);
    var arm = part(blob(R(0.12, 0.25, 0.12), furCol, 0, 20, 14), furMat, 0.014);
    arm.position.y = -0.2; pivot.add(arm);
    pivot.rotation.z = s * 0.3;
    arms.push({ pivot: pivot, side: s });
  });

  // head
  var head = new Group(); head.position.set(0, 1.02, 0); rig.add(head);
  head.add(part(blob(R(0.66, 0.58, 0.6), furCol, 0, 44, 30), furMat, 0.022));

  // ears
  var ears = [];
  [-1, 1].forEach(function (s) {
    var pivot = new Group(); pivot.position.set(s * 0.44, 0.42, -0.02); head.add(pivot);
    var ear = part(blob(R(0.2, 0.21, 0.1), furCol, 0, 24, 18), furMat, 0.014);
    ear.position.y = 0.12; pivot.add(ear);
    var inner = new Mesh(blob(R(0.11, 0.12, 0.04), flat('#d9d3f0'), 0, 16, 12), toon(0xffffff));
    inner.position.set(0, 0.12, 0.075); pivot.add(inner);
    pivot.rotation.z = -s * 0.3;
    ears.push({ pivot: pivot, base: -s * 0.3, side: s, seed: rand(0, TAU) });
  });

  // top and cheek tufts
  [[-0.1, 0.56, 0.08, 0.5], [0.0, 0.6, 0.1, 0.0], [0.1, 0.56, 0.08, -0.5]].forEach(function (t) {
    var tuft = part(blob(R(0.06, 0.15, 0.05), furCol, 0, 12, 10), furMat, 0.01);
    tuft.position.set(t[0], t[1], t[2]); tuft.rotation.z = t[3]; head.add(tuft);
  });
  [-1, 1].forEach(function (s) {
    [[0.6, 0.0, 0.14, 0.9], [0.6, -0.14, 0.14, 0.5], [0.52, -0.28, 0.2, 0.1]].forEach(function (t) {
      var tuft = part(blob(R(0.14, 0.065, 0.065), furCol, 0, 14, 10), furMat, 0.01);
      tuft.position.set(s * t[0], t[1], t[2]); tuft.rotation.z = -s * t[3]; head.add(tuft);
    });
  });

  // eyes
  var eyes = [];
  [-1, 1].forEach(function (s) {
    var eg = new Group(); eg.position.set(s * 0.27, 0.02, 0.52); eg.rotation.y = s * 0.28; head.add(eg);
    var eyeGeo = blob(R(0.095, 0.12, 0.05), flat('#7d52d6'), 0, 24, 18);
    eg.add(part(eyeGeo, new T.MeshBasicMaterial({ vertexColors: true }), 0.01));
    var low = new Mesh(blob(R(0.07, 0.06, 0.03), flat('#a583f2'), 0, 14, 10), new T.MeshBasicMaterial({ vertexColors: true }));
    low.position.set(0, -0.04, 0.025); eg.add(low);
    var pupil = new Mesh(blob(R(0.05, 0.07, 0.03), flat('#2a1650'), 0, 16, 12), new T.MeshBasicMaterial({ vertexColors: true }));
    pupil.position.set(0, 0.005, 0.03); eg.add(pupil);
    var shine = new Mesh(blob(R(0.026, 0.032, 0.02), flat('#ffffff'), 0, 12, 8), new T.MeshBasicMaterial({ vertexColors: true }));
    shine.position.set(-0.03, 0.045, 0.055); eg.add(shine);
    var shine2 = new Mesh(blob(R(0.012, 0.012, 0.01), flat('#ffffff'), 0, 8, 6), new T.MeshBasicMaterial({ vertexColors: true }));
    shine2.position.set(0.03, -0.03, 0.055); eg.add(shine2);
    eyes.push(eg);
  });

  // muzzle, nose, mouth
  var muzzle = part(blob(R(0.17, 0.12, 0.12), flat('#eceff8'), 0, 24, 16), furMat, 0.01);
  muzzle.position.set(0, -0.14, 0.52); head.add(muzzle);
  var nose = new Mesh(blob(R(0.045, 0.032, 0.03), flat('#3f3b60'), 0, 14, 10), toon(0xffffff));
  nose.position.set(0, -0.09, 0.64); head.add(nose);
  var mouth = new Mesh(blob(R(0.03, 0.014, 0.012), flat('#3f3b60'), 0, 10, 8), toon(0xffffff));
  mouth.position.set(0, -0.19, 0.635); head.add(mouth);

  /* ---- blue wisp scarf ---- */
  var wispTex = (function () {
    var w = 256, h = 64, c = document.createElement('canvas'); c.width = w; c.height = h;
    var g = c.getContext('2d'), img = g.createImageData(w, h);
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var u = x / (w - 1), v = y / (h - 1), edge = Math.abs(2 * v - 1);
      var a = (1 - Math.pow(edge, 7)) * Math.pow(Math.sin(Math.PI * u), 0.35);
      var m = Math.pow(edge, 1.6);          // 0 centre .. 1 edge
      var i = (y * w + x) * 4;
      img.data[i] = 138 - 80 * m; img.data[i + 1] = 184 - 96 * m; img.data[i + 2] = 255 - 40 * m;
      img.data[i + 3] = Math.round(235 * a);
    }
    g.putImageData(img, 0, 0);
    return new T.CanvasTexture(c);
  })();
  var wispMat = new T.MeshBasicMaterial({ map: wispTex, transparent: true, depthWrite: false, side: T.DoubleSide });

  function makeWisp(cfg) {
    var N = 72, pts = [], pos = new Float32Array(N * 2 * 3), uv = [], idx = [], up = new Vector3(0, 1, 0);
    for (var i = 0; i < N; i++) { pts.push(new Vector3()); var u = i / (N - 1); uv.push(u, 0, u, 1); if (i < N - 1) { var o = i * 2; idx.push(o, o + 1, o + 2, o + 1, o + 3, o + 2); } }
    var geo = new T.BufferGeometry();
    var attr = new T.BufferAttribute(pos, 3); attr.setUsage(T.DynamicDrawUsage);
    geo.setAttribute('position', attr);
    geo.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx);
    var mesh = new Mesh(geo, wispMat); mesh.frustumCulled = false; mesh.renderOrder = 3;
    var tan = new Vector3(), rad = new Vector3(), w = new Vector3(), a = new Vector3(), b = new Vector3();
    function update(t) {
      var i, u;
      for (i = 0; i < N; i++) {
        u = i / (N - 1);
        var ang = cfg.a0 + cfg.dir * cfg.span * u + 0.12 * Math.sin(t * 0.8 + cfg.phase) * u;
        var r = cfg.r0 + cfg.spread * Math.pow(u, 2.0) + 0.05 * Math.sin(u * 9 - t * 2.2 + cfg.phase) * u;
        var y = cfg.y0 + cfg.amp * Math.sin(u * Math.PI * 1.4 + cfg.phase + t * 1.2) * u;
        pts[i].set(r * Math.cos(ang), y, r * Math.sin(ang));
      }
      for (i = 0; i < N; i++) {
        u = i / (N - 1);
        tan.subVectors(pts[Math.min(i + 1, N - 1)], pts[Math.max(i - 1, 0)]).normalize();
        rad.set(pts[i].x, 0, pts[i].z).normalize();
        w.copy(up).multiplyScalar(0.65).addScaledVector(rad, 0.35);
        w.addScaledVector(tan, -w.dot(tan)).normalize();
        var wd = (0.05 + 0.21 * Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.12)), 0.9)) * (1 - 0.3 * u);
        a.copy(pts[i]).addScaledVector(w, wd / 2); b.copy(pts[i]).addScaledVector(w, -wd / 2);
        pos[i * 6] = a.x; pos[i * 6 + 1] = a.y; pos[i * 6 + 2] = a.z;
        pos[i * 6 + 3] = b.x; pos[i * 6 + 4] = b.y; pos[i * 6 + 5] = b.z;
      }
      attr.needsUpdate = true;
    }
    update(0);
    return { mesh: mesh, update: update };
  }
  var wisps = [
    makeWisp({ a0: 0.35 * Math.PI, dir: 1, span: 1.9 * Math.PI, r0: 0.6, spread: 1.15, y0: 0.64, amp: 0.38, phase: 0 }),
    makeWisp({ a0: 1.25 * Math.PI, dir: -1, span: 1.5 * Math.PI, r0: 0.6, spread: 0.85, y0: 0.62, amp: 0.3, phase: 2.1 })
  ];
  wisps.forEach(function (w) { rig.add(w.mesh); });

  /* ================= animation ================= */
  var time = 0, blinkT = 2, blink = 0, hopT = 0, flickT = 1.5, flickEar = 0;

  function update(dt) {
    time += dt;
    var br = Math.sin(time * 2.2);

    // hop
    var hopY = 0, squash = 0, armUp = 0;
    if (hopT > 0) {
      hopT += dt / 0.6;
      if (hopT >= 1) { hopT = 0; }
      else {
        hopY = Math.sin(hopT * Math.PI) * 0.5;
        squash = hopT < 0.15 ? -hopT / 0.15 : (hopT > 0.85 ? -(1 - hopT) / 0.15 : 0.35);
        armUp = Math.sin(hopT * Math.PI);
      }
    }
    rig.position.y = 0.38 + hopY + 0.01 * br;
    rig.scale.set(1 - 0.06 * squash, 1 + 0.1 * squash, 1 - 0.06 * squash);

    body.scale.y = 1 + 0.02 * br;
    head.position.y = 1.02 + 0.012 * br;
    head.rotation.z = 0.05 * Math.sin(time * 0.9);
    head.rotation.y = 0.2 * Math.sin(time * 0.55);
    head.rotation.x = -0.02 + 0.02 * Math.sin(time * 1.3);

    // ears
    flickT -= dt;
    if (flickT < 0) { flickT = rand(2, 5); flickEar = Math.random() < 0.5 ? 0 : 1; ears[flickEar].flick = 0.35; }
    ears.forEach(function (e) {
      var extra = 0;
      if (e.flick > 0) { e.flick -= dt; extra = Math.sin((0.35 - e.flick) / 0.35 * Math.PI * 3) * 0.25; }
      e.pivot.rotation.z = e.base + 0.05 * Math.sin(time * 1.7 + e.seed) + extra * e.side + armUp * -e.side * 0.2;
    });

    // arms
    arms.forEach(function (a) {
      a.pivot.rotation.z = a.side * (0.3 + 1.0 * armUp);
      a.pivot.rotation.x = 0.15 * Math.sin(time * 1.4 + (a.side > 0 ? 0 : Math.PI));
    });

    // blink
    blinkT -= dt;
    if (blinkT < 0) { blink = 0.13; blinkT = rand(2.5, 5); }
    if (blink > 0) blink -= dt;
    var ey = blink > 0 ? 0.1 : 1;
    eyes.forEach(function (e) { e.scale.y += (ey - e.scale.y) * 0.6; });

    wisps.forEach(function (w) { w.update(time); });
  }

  return {
    group: group,
    update: update,
    hop: function () { if (hopT === 0) hopT = 0.0001; }
  };
}

/* =====================================================================
   DEMO SCENE  (delete this part when you move the creature into your game)
   ===================================================================== */
(function () {
  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);

  // lights that suit the cel shading
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  var key = new THREE.DirectionalLight(0xffffff, 0.55); key.position.set(2.5, 4, 4); scene.add(key);
  var rim = new THREE.DirectionalLight(0x9db8ff, 0.4); rim.position.set(-3, 2, -3); scene.add(rim);

  var pet = createSnowpuff(THREE);
  scene.add(pet.group);

  // soft ground + shadow
  function radial(stops) {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    stops.forEach(function (s) { gr.addColorStop(s[0], s[1]); });
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  var floor = new THREE.Mesh(new THREE.CircleGeometry(3.2, 48).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ map: radial([[0, 'rgba(255,255,255,0.95)'], [0.6, 'rgba(235,242,255,0.6)'], [1, 'rgba(220,232,255,0)']]), transparent: true, depthWrite: false }));
  floor.position.y = -0.005; scene.add(floor);
  var shadow = new THREE.Mesh(new THREE.CircleGeometry(0.85, 32).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ map: radial([[0, 'rgba(40,50,90,0.45)'], [1, 'rgba(40,50,90,0)']]), transparent: true, depthWrite: false }));
  shadow.position.y = 0.002; scene.add(shadow);

  // drifting snow
  var SN = 110, sp = new Float32Array(SN * 3), sv = new Float32Array(SN);
  for (var i = 0; i < SN; i++) {
    var a = Math.random() * Math.PI * 2, r = 0.8 + Math.random() * 3;
    sp[i * 3] = Math.cos(a) * r; sp[i * 3 + 1] = Math.random() * 4; sp[i * 3 + 2] = Math.sin(a) * r; sv[i] = 0.15 + Math.random() * 0.3;
  }
  var sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  var snow = new THREE.Points(sg, new THREE.PointsMaterial({ size: 0.06, map: radial([[0, 'rgba(255,255,255,1)'], [1, 'rgba(255,255,255,0)']]), transparent: true, depthWrite: false }));
  snow.frustumCulled = false; scene.add(snow);

  camera.position.set(0.8, 1.5, 4.6);
  var controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 0.85, 0);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 2.2;
  controls.maxDistance = 10;
  controls.maxPolarAngle = Math.PI * 0.52;

  function resize() {
    var w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 1 ? 34 + (1 - w / h) * 24 : 34;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  var down = null;
  canvas.addEventListener('pointerdown', function (e) { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  canvas.addEventListener('pointerup', function (e) {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 350) pet.hop();
    down = null;
  });

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    pet.update(dt);
    for (var i = 0; i < SN; i++) { sp[i * 3 + 1] -= sv[i] * dt; if (sp[i * 3 + 1] < 0) sp[i * 3 + 1] = 4; }
    sg.attributes.position.needsUpdate = true;
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
