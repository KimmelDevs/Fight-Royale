<title>Frostwing Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Layout: full-bleed WebGL stage; caption pinned top-left, one control dock pinned to the bottom. */
  :root {
    --stage-a: #c4c5d2;
    --stage-b: #8a8b9b;
    --ink: #1b1d2a;
    --muted: #4a4d63;
    --panel: rgba(247, 248, 253, 0.8);
    --line: rgba(27, 29, 42, 0.16);
    --accent: #2c6cd4;
    --accent-ink: #ffffff;
    --display: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
    --body: 'Figtree', ui-sans-serif, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --stage-a: #323443;
      --stage-b: #0d0e15;
      --ink: #eef0fa;
      --muted: #a4a7bf;
      --panel: rgba(22, 23, 34, 0.76);
      --line: rgba(238, 240, 250, 0.16);
      --accent: #8ccbff;
      --accent-ink: #0c1220;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --stage-a: #323443;
    --stage-b: #0d0e15;
    --ink: #eef0fa;
    --muted: #a4a7bf;
    --panel: rgba(22, 23, 34, 0.76);
    --line: rgba(238, 240, 250, 0.16);
    --accent: #8ccbff;
    --accent-ink: #0c1220;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
    overflow: hidden;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background-color: var(--stage-b);
    background-image: radial-gradient(120% 90% at 50% 38%, var(--stage-a), var(--stage-b));
    color: var(--ink);
    font-family: var(--body);
    font-size: 14px;
    line-height: 1.4;
  }
  #c {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    touch-action: none;
    cursor: grab;
    outline: none;
  }
  #c:active { cursor: grabbing; }

  header, .dock, .hint { position: relative; z-index: 1; }
  header { pointer-events: none; display: flex; flex-direction: column; gap: 2px; }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(26px, 5vw, 38px);
    letter-spacing: -0.02em;
    line-height: 1.05;
    text-wrap: balance;
  }
  .caption {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .hint {
    pointer-events: none;
    align-self: flex-end;
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    text-align: right;
  }

  .dock {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 18px;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }
  .seg {
    display: inline-flex;
    padding: 3px;
    gap: 2px;
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .seg button, .chip {
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: 0;
    cursor: pointer;
  }
  .seg button { padding: 7px 16px; border-radius: 999px; }
  .seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
  .ctrls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; min-width: 0; }
  .ctrls label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 500; }
  .ctrls input[type="range"] { width: 92px; accent-color: var(--accent); }
  .chip { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #fallback {
    position: fixed; inset: 0; z-index: 2; display: grid; place-items: center;
    padding: 24px; text-align: center; background: var(--stage-b); color: var(--ink);
  }
  @media (max-width: 560px) {
    .ctrls input[type="range"] { width: 72px; }
    .seg button { padding: 7px 12px; }
  }
</style>

<canvas id="c" tabindex="0" aria-label="Interactive 3D model of Frostwing, a crystal-feathered songbird"></canvas>
<div id="fallback" hidden>The 3D engine could not load. Reload the page to try again.</div>

<header>
  <h1>Frostwing</h1>
  <p class="caption" id="caption">View 1 · Mid-flight</p>
</header>

<p class="hint">Drag to orbit · scroll or pinch to zoom · tap the bird to hear it</p>

<main class="dock">
  <div class="seg" role="radiogroup" aria-label="Pose">
    <button type="button" role="radio" aria-checked="true" data-pose="flap">Flap</button>
    <button type="button" role="radio" aria-checked="false" data-pose="soar">Soar</button>
    <button type="button" role="radio" aria-checked="false" data-pose="perch">Perch</button>
  </div>
  <div class="ctrls">
    <label for="speed">Wingbeat <input id="speed" type="range" min="0.3" max="1.8" step="0.05" value="1"></label>
    <label for="glow">Glow <input id="glow" type="range" min="0" max="1.5" step="0.05" value="1"></label>
    <button type="button" class="chip" id="spin" aria-pressed="true">Auto-orbit</button>
    <button type="button" class="chip" id="ice" aria-pressed="true">Ice</button>
    <button type="button" class="chip" id="chirp">Chirp</button>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  'use strict';
  var T = window.THREE;
  if (!T || !T.OrbitControls) { document.getElementById('fallback').hidden = false; return; }

  var Vector3 = T.Vector3, Color = T.Color, Group = T.Group, Mesh = T.Mesh;
  var TAU = Math.PI * 2;
  function sstep(a, b, x) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function col(h) { return new Color(h); }

  /* ---------- renderer, camera, lights ---------- */
  var canvas = document.getElementById('c');
  var renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  var scene = new T.Scene();
  var camera = new T.PerspectiveCamera(36, 1, 0.1, 100);

  scene.add(new T.HemisphereLight(0xffffff, 0x8f95c6, 0.62));
  var keyL = new T.DirectionalLight(0xfff3e6, 0.78); keyL.position.set(3.5, 5, 4); scene.add(keyL);
  var rimL = new T.DirectionalLight(0x9cd2ff, 0.7); rimL.position.set(-4, 2.5, -3.5); scene.add(rimL);
  var fillL = new T.DirectionalLight(0xffffff, 0.22); fillL.position.set(-3, -1, 3); scene.add(fillL);

  var controls = new T.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.enablePan = false;
  controls.minDistance = 2.6;
  controls.maxDistance = 16;
  controls.autoRotateSpeed = 1.1;

  /* ---------- textures ---------- */
  function canvasTex(w, h, draw) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    return new T.CanvasTexture(c);
  }
  var glowTex = canvasTex(128, 128, function (g, w, h) {
    var gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.28, 'rgba(190,228,255,0.55)');
    gr.addColorStop(1, 'rgba(120,190,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  var shadowTex = canvasTex(128, 128, function (g, w, h) {
    var gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, 'rgba(10,12,30,0.55)');
    gr.addColorStop(1, 'rgba(10,12,30,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  var flakeTex = canvasTex(128, 128, function (g, w, h) {
    g.translate(w / 2, h / 2);
    g.strokeStyle = 'rgba(225,243,255,0.98)'; g.lineWidth = 5; g.lineCap = 'round';
    g.shadowColor = 'rgba(140,205,255,1)'; g.shadowBlur = 10;
    for (var k = 0; k < 6; k++) {
      g.save(); g.rotate(k * Math.PI / 3);
      g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -52);
      g.moveTo(0, -20); g.lineTo(-13, -33); g.moveTo(0, -20); g.lineTo(13, -33);
      g.moveTo(0, -36); g.lineTo(-9, -46); g.moveTo(0, -36); g.lineTo(9, -46);
      g.stroke(); g.restore();
    }
  });
  var ribbonTex = (function () {
    var w = 256, h = 64, c = document.createElement('canvas'); c.width = w; c.height = h;
    var g = c.getContext('2d'), img = g.createImageData(w, h);
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var u = x / (w - 1), v = y / (h - 1);
      var a = Math.pow(Math.sin(Math.PI * u), 1.15) * Math.pow(1 - Math.abs(2 * v - 1), 1.5);
      var i = (y * w + x) * 4;
      img.data[i] = 150 + 70 * u; img.data[i + 1] = 205 + 30 * u; img.data[i + 2] = 255; img.data[i + 3] = Math.round(255 * a);
    }
    g.putImageData(img, 0, 0);
    return new T.CanvasTexture(c);
  })();

  /* ---------- shared materials ---------- */
  var featherMat = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.78, metalness: 0, side: T.DoubleSide });
  var rimMat = new T.MeshBasicMaterial({ color: 0x6db8ff, transparent: true, opacity: 0.3, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide });
  var diamondMat = new T.MeshBasicMaterial({ color: 0xbfe9ff, transparent: true, opacity: 1, side: T.DoubleSide });
  var diamondFillMat = new T.MeshBasicMaterial({ color: 0x9fd9ff, transparent: true, opacity: 0.3, side: T.DoubleSide, depthWrite: false });
  var spriteMat = new T.SpriteMaterial({ map: glowTex, color: 0x7ec8ff, transparent: true, opacity: 0.85, blending: T.AdditiveBlending, depthWrite: false });
  var scatterMat = new T.MeshStandardMaterial({ roughness: 0.85, metalness: 0, side: T.DoubleSide });
  var crystalMat = new T.MeshPhongMaterial({ color: 0xd9eeff, specular: 0xffffff, shininess: 90, transparent: true, opacity: 0.62, flatShading: true, emissive: 0x4f8fe0, emissiveIntensity: 0.3, side: T.DoubleSide, depthWrite: false });
  var edgeMat = new T.LineBasicMaterial({ color: 0xeaf6ff, transparent: true, opacity: 0.7 });

  /* ---------- geometry helpers ---------- */
  function featherGeo(L, W, round, c0, c1, t0, t1) {
    var depth = 0.01;
    var s = new T.Shape(), cx = L * (0.55 + 0.3 * round);
    s.moveTo(0, 0);
    s.bezierCurveTo(L * 0.12, W * 0.62, cx, W * 0.7, L, 0);
    s.bezierCurveTo(cx, -W * 0.7, L * 0.12, -W * 0.62, 0, 0);
    var g = new T.ExtrudeGeometry(s, { depth: depth, bevelEnabled: false, curveSegments: 7 });
    g.translate(0, 0, -depth / 2);
    var pos = g.attributes.position, n = pos.count, arr = new Float32Array(n * 3), c = new Color();
    for (var i = 0; i < n; i++) {
      c.copy(c0).lerp(c1, sstep(t0, t1, pos.getX(i) / L));
      arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b;
    }
    g.setAttribute('color', new T.BufferAttribute(arr, 3));
    return g;
  }
  var diamondGeo = new T.RingGeometry(0.05, 0.08, 4, 1);
  var diamondFillGeo = new T.CircleGeometry(0.05, 4);

  function addDiamond(parent, x, y, sx, sy, z) {
    var d = new Mesh(diamondGeo, diamondMat); d.position.set(x, y, z || 0.009); d.scale.set(sx, sy, 1); parent.add(d);
    var f = new Mesh(diamondFillGeo, diamondFillMat); f.position.set(x, y, (z || 0.009) - 0.001); f.scale.set(sx * 0.9, sy * 0.9, 1); parent.add(f);
    var sp = new T.Sprite(spriteMat); sp.position.set(x, y, (z || 0.009) + 0.02); sp.scale.set(0.5 * sx, 0.5 * sx, 1); parent.add(sp);
  }

  /* ---------- body colours ---------- */
  var WHITE = col('#f8f7fd'), LAV = col('#e3e1f4'), TAN = col('#c99f76'), TAN2 = col('#b88b64');
  function bodyCol(d, out) {
    out.copy(WHITE).lerp(LAV, sstep(0.2, 1, d.y) * 0.5);
    var tan = sstep(0.12, 0.5, d.y) * sstep(-0.35, 0.35, d.z) * (1 - sstep(0.5, 0.95, Math.abs(d.x)));
    out.lerp(TAN, tan * 0.95);
    return out;
  }
  function headCol(d, out) {
    out.copy(WHITE);
    var e = 0.6 * d.y - 0.75 * d.z;
    out.lerp(TAN, sstep(0.02, 0.5, e));
    out.lerp(TAN2, sstep(0.55, 0.95, e) * 0.5);
    return out;
  }
  function colouredSphere(radii, fn, wSeg, hSeg) {
    var g = new T.SphereGeometry(1, wSeg || 48, hSeg || 32);
    var pos = g.attributes.position, n = pos.count, arr = new Float32Array(n * 3), c = new Color(), d = new Vector3();
    for (var i = 0; i < n; i++) {
      d.set(pos.getX(i), pos.getY(i), pos.getZ(i)).normalize();
      fn(d, c); arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b;
    }
    g.setAttribute('color', new T.BufferAttribute(arr, 3));
    g.scale(radii.x, radii.y, radii.z);
    return g;
  }

  /* ---------- instanced body feathers ---------- */
  var leafUnit = (function () {
    var s = new T.Shape();
    s.moveTo(0, 0);
    s.bezierCurveTo(0.12, 0.4, 0.8, 0.46, 1, 0);
    s.bezierCurveTo(0.8, -0.46, 0.12, -0.4, 0, 0);
    var g = new T.ExtrudeGeometry(s, { depth: 0.03, bevelEnabled: false, curveSegments: 5 });
    g.translate(0, 0, -0.015);
    return g;
  })();
  function scatter(count, radii, center, flow, size, colorFn, skipFn) {
    var inst = new T.InstancedMesh(leafUnit, scatterMat, count);
    inst.frustumCulled = false;
    var m = new T.Matrix4(), c = new Color();
    var n = new Vector3(), f = new Vector3(), x = new Vector3(), y = new Vector3(), z = new Vector3(), d = new Vector3(), p = new Vector3(), sc = new Vector3();
    var F = flow.clone().normalize(), cand = Math.floor(count * 1.5), k = 0;
    for (var i = 0; i < cand && k < count; i++) {
      var yy = 1 - 2 * (i + 0.5) / cand, r = Math.sqrt(1 - yy * yy), ph = i * 2.399963;
      d.set(r * Math.cos(ph), yy, r * Math.sin(ph));
      if (skipFn && skipFn(d)) continue;
      n.set(d.x / radii.x, d.y / radii.y, d.z / radii.z).normalize();
      f.copy(F).addScaledVector(n, -F.dot(n));
      if (f.lengthSq() < 0.02) continue;
      f.normalize();
      x.copy(f).multiplyScalar(0.93).addScaledVector(n, 0.36).normalize();
      z.copy(n).addScaledVector(x, -n.dot(x)).normalize();
      y.crossVectors(z, x).normalize();
      p.set(d.x * radii.x, d.y * radii.y, d.z * radii.z).add(center).addScaledVector(n, 0.012);
      var s = size * (0.85 + Math.random() * 0.5);
      m.makeBasis(x, y, z); m.scale(sc.set(s, s, s)); m.setPosition(p);
      inst.setMatrixAt(k, m);
      colorFn(d, c); c.offsetHSL(0, 0, (Math.random() - 0.5) * 0.05);
      inst.setColorAt(k, c);
      k++;
    }
    inst.count = k;
    inst.instanceMatrix.needsUpdate = true;
    if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
    return inst;
  }

  /* ---------- the bird ---------- */
  var bird = new Group();
  scene.add(bird);

  // body
  var BODY_R = new Vector3(0.52, 0.5, 0.7);
  var body = new Mesh(colouredSphere(BODY_R, bodyCol), new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 }));
  bird.add(body);
  bird.add(scatter(850, BODY_R, new Vector3(0, 0, 0), new Vector3(0, -0.3, -1), 0.23, bodyCol));

  // chest diamond
  var chest = new Group(); chest.position.set(0, 0.1, 0.74); chest.rotation.x = -0.12; bird.add(chest);
  addDiamond(chest, 0, 0, 0.9, 1.5, 0.0);

  // head
  var head = new Group(); head.position.set(0, 0.5, 0.42); bird.add(head);
  var HEAD_R = new Vector3(0.42, 0.4, 0.42);
  head.add(new Mesh(colouredSphere(HEAD_R, headCol, 40, 28), new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 })));
  head.add(scatter(300, HEAD_R, new Vector3(0, 0, 0), new Vector3(0, 0.08, -1), 0.16, headCol, function (d) { return d.z > 0.72 && Math.abs(d.x) < 0.35 && d.y < 0.2; }));

  // crest
  var crestMat = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, side: T.DoubleSide });
  (function () {
    var specs = [[0, 0.5, -0.8, 0.30, 0.1], [0.05, 0.62, -0.5, 0.34, 0.1], [-0.08, 0.5, -0.65, 0.24, 0.09]];
    specs.forEach(function (s) {
      var g = featherGeo(s[3], s[4], 0.2, col('#f6f3f0'), col('#d8b48f'), 0.1, 1);
      var m = new Mesh(g, crestMat);
      var xA = new Vector3(s[0], s[1], s[2]).normalize();
      var zA = new Vector3(1, 0, 0); zA.addScaledVector(xA, -zA.dot(xA)).normalize();
      var yA = new Vector3().crossVectors(zA, xA).normalize();
      m.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(xA, yA, zA));
      m.position.set(s[0] * 0.2, 0.36, 0.06);
      head.add(m);
    });
  })();

  // eyes
  var eyes = [];
  [-1, 1].forEach(function (side) {
    var eg = new Group();
    var dir = new Vector3(side * 0.66, 0.12, 0.74).normalize();
    eg.position.copy(dir).multiplyScalar(0.405);
    eg.quaternion.setFromUnitVectors(new Vector3(0, 0, 1), dir);
    var iris = new Mesh(new T.SphereGeometry(0.088, 24, 18), new T.MeshStandardMaterial({ color: 0x8a64ea, roughness: 0.25, emissive: 0x3b2478, emissiveIntensity: 0.5 }));
    iris.scale.set(1, 1.12, 0.6); eg.add(iris);
    var pupil = new Mesh(new T.SphereGeometry(0.05, 16, 12), new T.MeshBasicMaterial({ color: 0x0f0a1f }));
    pupil.scale.set(1, 1.1, 0.5); pupil.position.z = 0.03; eg.add(pupil);
    var shine = new Mesh(new T.SphereGeometry(0.02, 10, 8), new T.MeshBasicMaterial({ color: 0xffffff }));
    shine.position.set(0.026, 0.034, 0.058); eg.add(shine);
    var blush = new Mesh(new T.CircleGeometry(0.07, 20), new T.MeshBasicMaterial({ color: 0xf2aab9, transparent: true, opacity: 0.4, depthWrite: false }));
    var bd = new Vector3(side * 0.82, -0.28, 0.5).normalize();
    blush.position.copy(bd).multiplyScalar(0.415);
    blush.quaternion.setFromUnitVectors(new Vector3(0, 0, 1), bd);
    head.add(blush);
    head.add(eg); eyes.push(eg);
  });

  // beak
  var beakMat = new T.MeshStandardMaterial({ color: 0xf0b13a, roughness: 0.45 });
  var upperG = new T.ConeGeometry(0.075, 0.26, 16); upperG.rotateX(Math.PI / 2); upperG.scale(1, 0.62, 1);
  var upper = new Mesh(upperG, beakMat); upper.position.set(0, -0.015, 0.45); head.add(upper);
  var lowerPivot = new Group(); lowerPivot.position.set(0, -0.055, 0.36); head.add(lowerPivot);
  var lowerG = new T.ConeGeometry(0.06, 0.2, 16); lowerG.rotateX(Math.PI / 2); lowerG.scale(1, 0.5, 1); lowerG.translate(0, 0, 0.1);
  lowerPivot.add(new Mesh(lowerG, new T.MeshStandardMaterial({ color: 0xe19f2e, roughness: 0.5 })));
  var mouthG = new T.SphereGeometry(0.05, 12, 10); mouthG.scale(1, 0.4, 1.6);
  var mouth = new Mesh(mouthG, new T.MeshBasicMaterial({ color: 0x8f2f44 })); mouth.position.set(0, 0.0, 0.07); lowerPivot.add(mouth);

  // feet
  var darkMat = new T.MeshStandardMaterial({ color: 0x2b2c36, roughness: 0.55 });
  var toeG = new T.CylinderGeometry(0.022, 0.032, 0.2, 8); toeG.rotateX(Math.PI / 2); toeG.translate(0, 0, 0.1);
  var clawG = new T.ConeGeometry(0.03, 0.1, 8); clawG.rotateX(Math.PI / 2); clawG.translate(0, 0, 0.245);
  var legG = new T.CylinderGeometry(0.026, 0.03, 1, 8);
  var feet = [];
  [-1, 1].forEach(function (side) {
    var leg = new Mesh(legG, darkMat); bird.add(leg);
    var foot = new Group(); bird.add(foot);
    var toes = [];
    [-0.38, 0, 0.38].forEach(function (a) {
      var tp = new Group(); tp.rotation.y = a;
      tp.add(new Mesh(toeG, darkMat)); tp.add(new Mesh(clawG, darkMat));
      foot.add(tp); toes.push(tp);
    });
    var back = new Group(); back.rotation.y = Math.PI;
    var bt = new Mesh(toeG, darkMat); bt.scale.set(1, 1, 0.55); back.add(bt); foot.add(back);
    feet.push({ side: side, leg: leg, foot: foot, toes: toes });
  });

  /* ---------- wings ---------- */
  var PRIM = [
    [0.10, 0.62, 1.45, 1.0, '#4b4f6c'], [0.20, 0.56, 1.62, 0.95, '#50546f'], [0.30, 0.50, 1.70, 0.9, '#565a75'],
    [0.41, 0.44, 1.72, 0.8, '#5f6380'], [0.52, 0.38, 1.66, 0.7, '#6a6e8b'], [0.63, 0.32, 1.58, 0.6, '#767a96'],
    [0.75, 0.26, 1.48, 0.5, '#8588a3'], [0.87, 0.20, 1.36, 0.4, '#9598b2'], [0.99, 0.14, 1.24, 0.3, '#a5a8c0'],
    [1.10, 0.08, 1.12, 0.2, '#b3b6cc']
  ];
  var FLIGHT_BASE = col('#f4f3fc');

  function buildWingRig(mirrored) {
    var mirror = new Group(); if (mirrored) mirror.scale.x = -1;
    var roll = new Group(), sweep = new Group(), flap = new Group();
    roll.position.set(0.34, 0.22, 0.1);
    mirror.add(roll); roll.add(sweep); sweep.add(flap);
    var items = [];

    function feather(o) {
      var pivot = new Group(); pivot.position.set(o.rx, o.layer * 0.012 + o.i * 0.0016, 0);
      var fm = new Group(); fm.rotation.x = -Math.PI / 2;
      var geo = featherGeo(o.L, o.W, o.round, o.c0, o.c1, o.t0, o.t1);
      fm.add(new Mesh(geo, featherMat));
      if (o.glow) { var gm = new Mesh(geo, rimMat); gm.scale.set(1.03, 1.25, 1); gm.position.z = -0.007; fm.add(gm); }
      pivot.add(fm); flap.add(pivot);
      var it = { pivot: pivot, fm: fm, theta: o.theta, outer: o.outer, i: o.i };
      items.push(it);
      return it;
    }

    // leading-edge arm
    var armG = new T.SphereGeometry(1, 16, 12); armG.scale(0.55, 0.075, 0.12); armG.translate(0.42, 0.0, 0.0);
    flap.add(new Mesh(armG, new T.MeshStandardMaterial({ color: 0xf2f1fa, roughness: 0.9 })));

    PRIM.forEach(function (p, i) {
      feather({ theta: p[0], rx: p[1], L: p[2], W: i < 3 ? 0.22 : 0.27, round: -0.2, c0: FLIGHT_BASE, c1: col(p[4]), t0: 0.3, t1: 0.92, layer: 0, outer: p[3], i: i, glow: i < 7 });
    });
    PRIM.forEach(function (p, i) {
      var L1 = p[2] * 0.62;
      var it = feather({ theta: p[0], rx: p[1], L: L1, W: 0.3, round: 0.9, c0: col('#fcfcff'), c1: col('#dedff2'), t0: 0.2, t1: 1, layer: 1, outer: p[3] * 0.8, i: i });
      if (i === 4) addDiamond(it.fm, L1 * 0.74, 0, 1.9, 1.25);
    });
    for (var j = 0; j < 8; j++) {
      var p2 = PRIM[j];
      feather({ theta: p2[0] + 0.05, rx: p2[1], L: 0.36 * p2[2] + 0.05, W: 0.27, round: 1, c0: col('#fdfdff'), c1: col('#ecebf8'), t0: 0.2, t1: 1, layer: 2, outer: p2[3] * 0.5, i: j });
    }
    for (var q = 0; q < 6; q++) {
      feather({ theta: q * 0.24, rx: 0.02 + q * 0.01, L: 0.36, W: 0.26, round: 1, c0: col('#fdfcff'), c1: col('#efe7f0'), t0: 0.2, t1: 1, layer: 3, outer: 0.1, i: q });
    }
    return { mirror: mirror, roll: roll, sweep: sweep, flap: flap, items: items };
  }
  var rigs = [buildWingRig(false), buildWingRig(true)];
  rigs.forEach(function (r) { bird.add(r.mirror); });

  /* ---------- tail ---------- */
  var tailRoot = new Group(); tailRoot.position.set(0, 0.02, -0.55); bird.add(tailRoot);
  var tailItems = [];
  (function () {
    var N = 9;
    for (var i = 0; i < N; i++) {
      var t = i / (N - 1), edge = Math.abs(t - 0.5) * 2;
      var L = 1.6 - 0.55 * Math.pow(edge, 1.5);
      var phi = (t - 0.5) * 1.1;
      var pivot = new Group(); pivot.position.y = (1 - edge) * 0.02;
      var fm = new Group(); fm.rotation.x = -Math.PI / 2;
      var geo = featherGeo(L, 0.25, -0.1, col('#f4f3fc'), col(edge < 0.5 ? '#4e526e' : '#7c809c'), 0.3, 0.95);
      fm.add(new Mesh(geo, featherMat));
      var gm = new Mesh(geo, rimMat); gm.scale.set(1.03, 1.25, 1); gm.position.z = -0.007; fm.add(gm);
      if (i === 4) addDiamond(fm, L * 0.6, 0, 1.9, 1.25);
      if (i === 2 || i === 6) addDiamond(fm, L * 0.68, 0, 1.2, 0.8);
      pivot.add(fm); tailRoot.add(pivot);
      tailItems.push({ pivot: pivot, fm: fm, phi: phi, i: i });
    }
  })();

  // glow light that travels with the bird
  var blueLight = new T.PointLight(0x7fbfff, 0.9, 6); blueLight.position.set(0, 0.2, 0.4); bird.add(blueLight);

  /* ---------- ice, swirls, sparkles ---------- */
  var fx = new Group(); scene.add(fx);

  var crystals = [];
  (function () {
    var prof = [new T.Vector2(0.0, -1.0), new T.Vector2(0.28, -0.55), new T.Vector2(0.28, 0.55), new T.Vector2(0.0, 1.0)];
    var cg = new T.LatheGeometry(prof, 6);
    var eg = new T.EdgesGeometry(cg);
    for (var i = 0; i < 15; i++) {
      var g = new Group();
      var m = new Mesh(cg, crystalMat); g.add(m);
      g.add(new T.LineSegments(eg, edgeMat));
      var h = i < 11 ? rand(0.28, 0.6) : rand(0.1, 0.2);
      g.scale.set(h * 0.4, h, h * 0.4);
      fx.add(g);
      crystals.push({ g: g, r: rand(2.3, 3.4), a: rand(0, TAU), w: rand(0.08, 0.22) * (Math.random() < 0.5 ? -1 : 1), y: rand(-1.0, 1.8), bob: rand(0.1, 0.3), bp: rand(0, TAU), sp: new Vector3(rand(0.2, 0.7), rand(0.2, 0.7), rand(0.1, 0.4)) });
    }
  })();

  var flakes = [];
  for (var fi = 0; fi < 4; fi++) {
    var fs = new T.Sprite(new T.SpriteMaterial({ map: flakeTex, transparent: true, depthWrite: false, opacity: 0.9 }));
    var sz = rand(0.3, 0.5); fs.scale.set(sz, sz, 1); fx.add(fs);
    flakes.push({ s: fs, r: rand(2.0, 3.0), a: rand(0, TAU), w: rand(0.1, 0.2), y: rand(-0.6, 1.5), bp: rand(0, TAU) });
  }

  var ribbons = new Group(); fx.add(ribbons);
  function makeRibbon(k) {
    var R = 2.0 + k * 0.28, a0 = k * 1.7, span = 2.1 + k * 0.25, y0 = -0.2 + (k % 2) * 0.6, amp = 0.3 + 0.1 * k, tilt = 0.5 + 0.12 * k;
    var n = 48, pos = [], uv = [], idx = [], pts = [], up = new Vector3(0, 1, 0);
    for (var i = 0; i < n; i++) {
      var u = i / (n - 1), phi = a0 + span * u, r = R + 0.25 * Math.sin(u * Math.PI * 1.5 + k);
      pts.push(new Vector3(r * Math.cos(phi), y0 + amp * Math.sin(u * Math.PI + k) + (u - 0.5) * 0.9, r * Math.sin(phi)));
    }
    for (var j = 0; j < n; j++) {
      var u2 = j / (n - 1), p = pts[j];
      var tan = new Vector3().subVectors(pts[Math.min(j + 1, n - 1)], pts[Math.max(j - 1, 0)]).normalize();
      var rad = new Vector3(p.x, 0, p.z).normalize();
      var w = up.clone().multiplyScalar(1 - tilt).addScaledVector(rad, tilt);
      w.addScaledVector(tan, -w.dot(tan)).normalize();
      var wd = 0.34 * Math.sin(Math.PI * u2) + 0.02;
      var a = p.clone().addScaledVector(w, wd / 2), b = p.clone().addScaledVector(w, -wd / 2);
      pos.push(a.x, a.y, a.z, b.x, b.y, b.z);
      uv.push(u2, 0, u2, 1);
      if (j < n - 1) { var o = j * 2; idx.push(o, o + 1, o + 2, o + 1, o + 3, o + 2); }
    }
    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    return new Mesh(g, new T.MeshBasicMaterial({ map: ribbonTex, transparent: true, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide, opacity: 0.85 }));
  }
  for (var rk = 0; rk < 4; rk++) ribbons.add(makeRibbon(rk));

  var SPARK_N = 170, sparkPos = new Float32Array(SPARK_N * 3), sparkVel = new Float32Array(SPARK_N);
  for (var si = 0; si < SPARK_N; si++) {
    var sr = rand(0.8, 3.6), sa = rand(0, TAU);
    sparkPos[si * 3] = sr * Math.cos(sa); sparkPos[si * 3 + 1] = rand(-1.8, 2.4); sparkPos[si * 3 + 2] = sr * Math.sin(sa);
    sparkVel[si] = rand(0.05, 0.22);
  }
  var sparkGeo = new T.BufferGeometry(); sparkGeo.setAttribute('position', new T.BufferAttribute(sparkPos, 3));
  var sparkMat = new T.PointsMaterial({ size: 0.09, map: glowTex, color: 0xd5eaff, transparent: true, opacity: 0.9, depthWrite: false, blending: T.AdditiveBlending });
  var sparks = new T.Points(sparkGeo, sparkMat); sparks.frustumCulled = false; fx.add(sparks);

  /* ---------- perch ledge and ground shadow ---------- */
  var ledge = new Group(); scene.add(ledge);
  (function () {
    var ledgeMat = new T.MeshPhongMaterial({ color: 0xcfe6ff, specular: 0xffffff, shininess: 70, transparent: true, opacity: 0.92, flatShading: true, emissive: 0x3a6fbe, emissiveIntensity: 0.28 });
    var baseG = new T.CylinderGeometry(0.95, 1.1, 0.3, 6);
    ledge.add(new Mesh(baseG, ledgeMat));
    ledge.add(new T.LineSegments(new T.EdgesGeometry(baseG), edgeMat));
    var cap = new Mesh(new T.CylinderGeometry(0.9, 0.95, 0.06, 6), new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }));
    cap.position.y = 0.17; ledge.add(cap);
    var prof = [new T.Vector2(0, -1), new T.Vector2(0.28, -0.55), new T.Vector2(0.28, 0.55), new T.Vector2(0, 1)];
    var cg = new T.LatheGeometry(prof, 6), eg = new T.EdgesGeometry(cg);
    for (var i = 0; i < 6; i++) {
      var a = i / 6 * TAU + 0.3, h = rand(0.3, 0.55);
      var g = new Group(); g.add(new Mesh(cg, crystalMat)); g.add(new T.LineSegments(eg, edgeMat));
      g.scale.set(h * 0.35, h, h * 0.35);
      g.position.set(Math.cos(a) * 0.98, 0.05 + h * 0.45, Math.sin(a) * 0.98);
      g.rotation.set(Math.sin(a) * 0.35, 0, -Math.cos(a) * 0.35);
      ledge.add(g);
    }
  })();
  var shadow = new Mesh(new T.PlaneGeometry(4.2, 4.2).rotateX(-Math.PI / 2), new T.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, opacity: 0.5 }));
  scene.add(shadow);

  /* ---------- poses and views ---------- */
  var POSES = {
    flap:  { fold: 0, amp: 0.6,  base: 0.38,  hz: 1.35, pitch: -0.3,  tail: 1.0,  tp: -0.32, leg: 0, bob: 0.16, roll: 0.1,  yaw: 0.0,  mouth: 0.55, look: 0.0 },
    soar:  { fold: 0, amp: 0.07, base: 0.14,  hz: 0.45, pitch: -0.06, tail: 1.1,  tp: -0.12, leg: 0, bob: 0.05, roll: 0.05, yaw: 0.25, mouth: 0.0,  look: 0.15 },
    perch: { fold: 1, amp: 0.0,  base: -0.1,  hz: 0.3,  pitch: -0.2,  tail: 0.28, tp: -0.28, leg: 1, bob: 0.0,  roll: 0.0,  yaw: 0.0,  mouth: 0.0,  look: 0.5 }
  };
  var CAPTIONS = { flap: 'View 1 · Mid-flight', soar: 'View 2 · Wings spread', perch: 'View 3 · Perched' };
  var VIEWS = {
    flap:  { pos: new Vector3(4.6, 1.6, 4.0), target: new Vector3(0, 0.25, 0) },
    soar:  { pos: new Vector3(0.0, 1.5, 6.4), target: new Vector3(0, 0.0, 0) },
    perch: { pos: new Vector3(5.2, 0.5, 1.6), target: new Vector3(0, -0.25, 0) }
  };
  var cur = {}, tgt = {}, poseName = 'flap';
  Object.keys(POSES.flap).forEach(function (k) { cur[k] = POSES.flap[k]; tgt[k] = POSES.flap[k]; });

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var speed = 1, glow = 1, iceOn = true, spinOn = !reduceMotion;

  function fitFactor() {
    var a = camera.aspect;
    return a < 1.15 ? 1 + (1.15 - a) * 1.15 : 1;
  }
  var tween = null;
  function goView(name, instant) {
    var v = VIEWS[name], f = fitFactor();
    var to = v.target.clone().add(v.pos.clone().sub(v.target).multiplyScalar(f));
    if (instant) { camera.position.copy(to); controls.target.copy(v.target); controls.update(); return; }
    tween = { t: 0, from: camera.position.clone(), fromT: controls.target.clone(), to: to, toT: v.target.clone() };
  }
  function setPose(name) {
    poseName = name;
    var P = POSES[name]; Object.keys(P).forEach(function (k) { tgt[k] = P[k]; });
    document.querySelectorAll('.seg button').forEach(function (b) { b.setAttribute('aria-checked', b.dataset.pose === name ? 'true' : 'false'); });
    document.getElementById('caption').textContent = CAPTIONS[name];
    goView(name, false);
  }

  /* ---------- chirp ---------- */
  var actx = null, chirpClock = 0;
  function chirp() {
    chirpClock = 0.5;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      var t0 = actx.currentTime + 0.02;
      for (var k = 0; k < 3; k++) {
        var o = actx.createOscillator(), g = actx.createGain(), s = t0 + k * 0.16;
        o.type = 'sine';
        o.frequency.setValueAtTime(2300, s); o.frequency.exponentialRampToValueAtTime(3600, s + 0.09);
        g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.12, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.11);
        o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s + 0.13);
      }
    } catch (e) { /* audio is optional */ }
  }

  /* ---------- UI ---------- */
  document.querySelectorAll('.seg button').forEach(function (b) { b.addEventListener('click', function () { setPose(b.dataset.pose); }); });
  document.getElementById('speed').addEventListener('input', function (e) { speed = parseFloat(e.target.value); });
  document.getElementById('glow').addEventListener('input', function (e) { glow = parseFloat(e.target.value); });
  var spinBtn = document.getElementById('spin'), iceBtn = document.getElementById('ice');
  spinBtn.setAttribute('aria-pressed', spinOn ? 'true' : 'false');
  spinBtn.addEventListener('click', function () { spinOn = !spinOn; spinBtn.setAttribute('aria-pressed', spinOn ? 'true' : 'false'); });
  iceBtn.addEventListener('click', function () { iceOn = !iceOn; iceBtn.setAttribute('aria-pressed', iceOn ? 'true' : 'false'); });
  document.getElementById('chirp').addEventListener('click', chirp);
  controls.addEventListener('start', function () { tween = null; });
  var down = null;
  canvas.addEventListener('pointerdown', function (e) { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  canvas.addEventListener('pointerup', function (e) {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 350) chirp();
    down = null;
  });

  function resize() {
    var w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  goView('flap', true);

  /* ---------- animation ---------- */
  var phase = 0, time = 0, last = performance.now(), blinkT = 2.5, blink = 0;
  var tmpV = new Vector3();

  function update(dt) {
    time += dt;
    var k = 1 - Math.exp(-dt * 3.2);
    Object.keys(cur).forEach(function (key) { cur[key] += (tgt[key] - cur[key]) * k; });
    phase += dt * TAU * cur.hz * speed;
    var sp = Math.sin(phase), cp = Math.cos(phase);

    // glow controls
    spriteMat.opacity = Math.min(1, 0.85 * glow);
    rimMat.opacity = 0.3 * glow;
    diamondMat.opacity = Math.min(1, 0.35 + 0.65 * glow);
    diamondFillMat.opacity = 0.3 * glow;
    blueLight.intensity = (0.8 + 0.25 * Math.sin(time * 2)) * glow;

    // wings
    var flapAng = cur.base + cur.amp * sp;
    for (var r = 0; r < rigs.length; r++) {
      var rig = rigs[r];
      rig.flap.rotation.z = flapAng;
      rig.sweep.rotation.y = cur.fold * 1.28;
      rig.roll.rotation.z = -cur.fold * 0.7;
      for (var i = 0; i < rig.items.length; i++) {
        var it = rig.items[i];
        it.pivot.rotation.y = it.theta * (1 - 0.82 * cur.fold);
        var fl = Math.sin(time * 3 + it.i * 0.7 + r) * 0.015 * it.outer;
        it.pivot.rotation.z = -0.22 * it.outer * cur.amp * cp + fl;
        it.fm.rotation.x = -Math.PI / 2 + 0.1 * it.outer * cur.amp * cp + fl * 0.6;
      }
    }

    // tail
    tailRoot.rotation.x = cur.tp + 0.06 * sp * (cur.amp > 0.2 ? 1 : 0.3);
    for (var t = 0; t < tailItems.length; t++) {
      var ti = tailItems[t];
      ti.pivot.rotation.y = Math.PI / 2 + ti.phi * cur.tail;
      ti.pivot.rotation.z = Math.sin(time * 2.2 + ti.i * 0.6) * 0.03 * cur.tail;
    }

    // head, eyes, beak
    head.rotation.y = cur.look * Math.sin(time * 0.8) * 0.6;
    head.rotation.x = -0.05 + 0.03 * Math.sin(time * 1.3);
    blinkT -= dt;
    if (blinkT < 0) { blink = 0.14; blinkT = rand(2.5, 5); }
    if (blink > 0) blink -= dt;
    var eyeY = blink > 0 ? 0.12 : 1;
    eyes.forEach(function (e) { e.scale.y += (eyeY - e.scale.y) * 0.6; });
    var pulse = 0;
    if (chirpClock > 0) { chirpClock -= dt; var el = 0.5 - Math.max(0, chirpClock); pulse = 0.5 - 0.5 * Math.cos(el / 0.16 * TAU); }
    lowerPivot.rotation.x = 0.04 + 0.5 * Math.max(cur.mouth, pulse);

    // legs
    var legY = -0.5 + (-0.98 + 0.5) * cur.leg;
    var footZ = 0.14 - 0.09 * cur.leg;
    feet.forEach(function (f) {
      var hipY = -0.4, x = f.side * 0.2;
      f.foot.position.set(x, legY, footZ);
      f.foot.rotation.x = -bird.rotation.x * cur.leg;
      var len = Math.max(0.02, hipY - legY);
      f.leg.position.set(x, (hipY + legY) / 2, footZ * 0.6);
      f.leg.scale.set(1, len, 1);
      f.leg.visible = cur.leg > 0.05;
      f.toes.forEach(function (tp) { tp.rotation.x = 0.8 * (1 - cur.leg); });
    });

    // bird motion
    bird.position.y = cur.bob * (-cp) * 0.5 + 0.05 * pulse;
    bird.rotation.x = cur.pitch + 0.04 * sp * (cur.amp > 0.2 ? 1 : 0);
    bird.rotation.z = cur.roll * Math.sin(time * 0.7);
    bird.rotation.y = Math.sin(time * 0.35) * cur.yaw;

    // ledge and shadow
    ledge.visible = cur.leg > 0.02;
    ledge.scale.setScalar(Math.max(0.001, cur.leg));
    ledge.position.y = -1.07 - (1 - cur.leg) * 0.5;
    shadow.position.y = -1.75 + cur.leg * 0.4;
    var sh = 1 - 0.12 * (bird.position.y);
    shadow.scale.set(sh * (1 - 0.25 * cur.leg), 1, sh * (1 - 0.25 * cur.leg));
    shadow.material.opacity = 0.45;

    // fx
    fx.visible = iceOn;
    if (iceOn) {
      for (var c = 0; c < crystals.length; c++) {
        var cr = crystals[c]; cr.a += cr.w * dt;
        cr.g.position.set(Math.cos(cr.a) * cr.r, cr.y + Math.sin(time * 0.8 + cr.bp) * cr.bob, Math.sin(cr.a) * cr.r);
        cr.g.rotation.set(time * cr.sp.x * 0.5, time * cr.sp.y * 0.4, time * cr.sp.z * 0.3);
      }
      for (var f2 = 0; f2 < flakes.length; f2++) {
        var fk = flakes[f2]; fk.a += fk.w * dt;
        fk.s.position.set(Math.cos(fk.a) * fk.r, fk.y + Math.sin(time * 0.7 + fk.bp) * 0.2, Math.sin(fk.a) * fk.r);
      }
      ribbons.rotation.y += dt * 0.32;
      ribbons.rotation.z = Math.sin(time * 0.4) * 0.06;
      for (var s = 0; s < SPARK_N; s++) {
        sparkPos[s * 3 + 1] += sparkVel[s] * dt;
        if (sparkPos[s * 3 + 1] > 2.6) sparkPos[s * 3 + 1] = -1.9;
      }
      sparkGeo.attributes.position.needsUpdate = true;
      sparkMat.opacity = 0.7 + 0.25 * Math.sin(time * 3);
    }

    // camera
    if (tween) {
      tween.t += dt / 1.3;
      var e = Math.min(1, tween.t), ee = e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
      camera.position.lerpVectors(tween.from, tween.to, ee);
      controls.target.lerpVectors(tween.fromT, tween.toT, ee);
      if (e >= 1) tween = null;
    }
    controls.autoRotate = spinOn && !tween;
    controls.update();
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
