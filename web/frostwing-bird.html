<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frostwing Bird</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(120% 90% at 50% 38%, #c4c5d2, #8a8b9b); overflow: hidden; }
  #c { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* =====================================================================
   FROSTWING BIRD  (Three.js r128)
   ---------------------------------------------------------------------
   Copy createFrostwing() into your game. Usage:

     var bird = createFrostwing(THREE, { flapSpeed: 1, glow: 1 });
     scene.add(bird.group);            // bird.group is yours to move/rotate/scale
     // every frame:
     bird.update(deltaSeconds);

   The bird faces +Z. Other controls:
     bird.setSpeed(1.5);   // wingbeat speed multiplier
     bird.setGlow(0.5);    // 0 = no glow, 1 = default, 1.5 = bright
     bird.openBeak();      // quick chirp animation of the beak
   The scene needs lights (see the demo below for a good setup).
   ===================================================================== */
function createFrostwing(T, opts) {
  'use strict';
  opts = opts || {};
  var Vector3 = T.Vector3, Color = T.Color, Group = T.Group, Mesh = T.Mesh, TAU = Math.PI * 2;
  var speed = opts.flapSpeed != null ? opts.flapSpeed : 1;
  var glow = opts.glow != null ? opts.glow : 1;

  function sstep(a, b, x) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function col(h) { return new Color(h); }

  /* ---- glow texture + materials ---- */
  var gc = document.createElement('canvas'); gc.width = gc.height = 128;
  (function () {
    var g = gc.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.28, 'rgba(190,228,255,0.55)'); gr.addColorStop(1, 'rgba(120,190,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  })();
  var glowTex = new T.CanvasTexture(gc);

  var featherMat = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.78, metalness: 0, side: T.DoubleSide });
  var rimMat = new T.MeshBasicMaterial({ color: 0x6db8ff, transparent: true, opacity: 0.3, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide });
  var diamondMat = new T.MeshBasicMaterial({ color: 0xbfe9ff, transparent: true, opacity: 1, side: T.DoubleSide });
  var diamondFillMat = new T.MeshBasicMaterial({ color: 0x9fd9ff, transparent: true, opacity: 0.3, side: T.DoubleSide, depthWrite: false });
  var spriteMat = new T.SpriteMaterial({ map: glowTex, color: 0x7ec8ff, transparent: true, opacity: 0.85, blending: T.AdditiveBlending, depthWrite: false });
  var scatterMat = new T.MeshStandardMaterial({ roughness: 0.85, metalness: 0, side: T.DoubleSide });

  /* ---- geometry helpers ---- */
  function featherGeo(L, W, round, c0, c1, t0, t1) {
    var depth = 0.01, s = new T.Shape(), cx = L * (0.55 + 0.3 * round);
    s.moveTo(0, 0);
    s.bezierCurveTo(L * 0.12, W * 0.62, cx, W * 0.7, L, 0);
    s.bezierCurveTo(cx, -W * 0.7, L * 0.12, -W * 0.62, 0, 0);
    var g = new T.ExtrudeGeometry(s, { depth: depth, bevelEnabled: false, curveSegments: 7 });
    g.translate(0, 0, -depth / 2);
    var pos = g.attributes.position, n = pos.count, arr = new Float32Array(n * 3), c = new Color();
    for (var i = 0; i < n; i++) {
      c.copy(c0).lerp(c1, sstep(t0, t1, pos.getX(i) / L));
      arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b;
    }
    g.setAttribute('color', new T.BufferAttribute(arr, 3));
    return g;
  }
  var diamondGeo = new T.RingGeometry(0.05, 0.08, 4, 1);
  var diamondFillGeo = new T.CircleGeometry(0.05, 4);
  function addDiamond(parent, x, y, sx, sy, z) {
    var zz = z != null ? z : 0.009;
    var d = new Mesh(diamondGeo, diamondMat); d.position.set(x, y, zz); d.scale.set(sx, sy, 1); parent.add(d);
    var f = new Mesh(diamondFillGeo, diamondFillMat); f.position.set(x, y, zz - 0.001); f.scale.set(sx * 0.9, sy * 0.9, 1); parent.add(f);
    var sp = new T.Sprite(spriteMat); sp.position.set(x, y, zz + 0.02); sp.scale.set(0.5 * sx, 0.5 * sx, 1); parent.add(sp);
  }

  /* ---- colours ---- */
  var WHITE = col('#f8f7fd'), LAV = col('#e3e1f4'), TAN = col('#c99f76'), TAN2 = col('#b88b64');
  function bodyCol(d, out) {
    out.copy(WHITE).lerp(LAV, sstep(0.2, 1, d.y) * 0.5);
    var tan = sstep(0.12, 0.5, d.y) * sstep(-0.35, 0.35, d.z) * (1 - sstep(0.5, 0.95, Math.abs(d.x)));
    return out.lerp(TAN, tan * 0.95);
  }
  function headCol(d, out) {
    out.copy(WHITE);
    var e = 0.6 * d.y - 0.75 * d.z;
    out.lerp(TAN, sstep(0.02, 0.5, e));
    return out.lerp(TAN2, sstep(0.55, 0.95, e) * 0.5);
  }
  function colouredSphere(radii, fn, wSeg, hSeg) {
    var g = new T.SphereGeometry(1, wSeg || 48, hSeg || 32);
    var pos = g.attributes.position, n = pos.count, arr = new Float32Array(n * 3), c = new Color(), d = new Vector3();
    for (var i = 0; i < n; i++) {
      d.set(pos.getX(i), pos.getY(i), pos.getZ(i)).normalize();
      fn(d, c); arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b;
    }
    g.setAttribute('color', new T.BufferAttribute(arr, 3));
    g.scale(radii.x, radii.y, radii.z);
    return g;
  }

  /* ---- small fluffy feathers scattered over an ellipsoid ---- */
  var leafUnit = (function () {
    var s = new T.Shape();
    s.moveTo(0, 0);
    s.bezierCurveTo(0.12, 0.4, 0.8, 0.46, 1, 0);
    s.bezierCurveTo(0.8, -0.46, 0.12, -0.4, 0, 0);
    var g = new T.ExtrudeGeometry(s, { depth: 0.03, bevelEnabled: false, curveSegments: 5 });
    g.translate(0, 0, -0.015);
    return g;
  })();
  function scatter(count, radii, center, flow, size, colorFn, skipFn) {
    var inst = new T.InstancedMesh(leafUnit, scatterMat, count);
    inst.frustumCulled = false;
    var m = new T.Matrix4(), c = new Color();
    var n = new Vector3(), f = new Vector3(), x = new Vector3(), y = new Vector3(), z = new Vector3(), d = new Vector3(), p = new Vector3(), sc = new Vector3();
    var F = flow.clone().normalize(), cand = Math.floor(count * 1.5), k = 0;
    for (var i = 0; i < cand && k < count; i++) {
      var yy = 1 - 2 * (i + 0.5) / cand, r = Math.sqrt(1 - yy * yy), ph = i * 2.399963;
      d.set(r * Math.cos(ph), yy, r * Math.sin(ph));
      if (skipFn && skipFn(d)) continue;
      n.set(d.x / radii.x, d.y / radii.y, d.z / radii.z).normalize();
      f.copy(F).addScaledVector(n, -F.dot(n));
      if (f.lengthSq() < 0.02) continue;
      f.normalize();
      x.copy(f).multiplyScalar(0.93).addScaledVector(n, 0.36).normalize();
      z.copy(n).addScaledVector(x, -n.dot(x)).normalize();
      y.crossVectors(z, x).normalize();
      p.set(d.x * radii.x, d.y * radii.y, d.z * radii.z).add(center).addScaledVector(n, 0.012);
      var s = size * (0.85 + Math.random() * 0.5);
      m.makeBasis(x, y, z); m.scale(sc.set(s, s, s)); m.setPosition(p);
      inst.setMatrixAt(k, m);
      colorFn(d, c); c.offsetHSL(0, 0, (Math.random() - 0.5) * 0.05);
      inst.setColorAt(k, c);
      k++;
    }
    inst.count = k;
    inst.instanceMatrix.needsUpdate = true;
    if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
    return inst;
  }

  /* ================= build the bird ================= */
  var group = new Group();          // yours: position / rotate / scale this
  var bird = new Group();           // animated inner group (bob, pitch, roll)
  group.add(bird);

  // body
  var BODY_R = new Vector3(0.52, 0.5, 0.7);
  bird.add(new Mesh(colouredSphere(BODY_R, bodyCol), new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 })));
  bird.add(scatter(1700, BODY_R, new Vector3(0, 0, 0), new Vector3(0, -0.3, -1), 0.16, bodyCol));
  var chest = new Group(); chest.position.set(0, 0.1, 0.74); chest.rotation.x = -0.12; bird.add(chest);
  addDiamond(chest, 0, 0, 0.9, 1.5, 0.0);

  // head
  var head = new Group(); head.position.set(0, 0.5, 0.42); bird.add(head);
  var HEAD_R = new Vector3(0.42, 0.4, 0.42);
  head.add(new Mesh(colouredSphere(HEAD_R, headCol, 40, 28), new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 })));
  head.add(scatter(520, HEAD_R, new Vector3(0, 0, 0), new Vector3(0, 0.08, -1), 0.12, headCol, function (d) { return d.z > 0.72 && Math.abs(d.x) < 0.35 && d.y < 0.2; }));

  // crest
  var crestMat = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, side: T.DoubleSide });
  [[0, 0.5, -0.8, 0.30, 0.1], [0.05, 0.62, -0.5, 0.34, 0.1], [-0.08, 0.5, -0.65, 0.24, 0.09]].forEach(function (s) {
    var m = new Mesh(featherGeo(s[3], s[4], 0.2, col('#f6f3f0'), col('#d8b48f'), 0.1, 1), crestMat);
    var xA = new Vector3(s[0], s[1], s[2]).normalize();
    var zA = new Vector3(1, 0, 0); zA.addScaledVector(xA, -zA.dot(xA)).normalize();
    var yA = new Vector3().crossVectors(zA, xA).normalize();
    m.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(xA, yA, zA));
    m.position.set(s[0] * 0.2, 0.36, 0.06);
    head.add(m);
  });

  // eyes + blush
  var eyes = [];
  [-1, 1].forEach(function (side) {
    var eg = new Group(), dir = new Vector3(side * 0.66, 0.12, 0.74).normalize();
    eg.position.copy(dir).multiplyScalar(0.405);
    eg.quaternion.setFromUnitVectors(new Vector3(0, 0, 1), dir);
    var iris = new Mesh(new T.SphereGeometry(0.088, 24, 18), new T.MeshStandardMaterial({ color: 0x8a64ea, roughness: 0.25, emissive: 0x3b2478, emissiveIntensity: 0.5 }));
    iris.scale.set(1, 1.12, 0.6); eg.add(iris);
    var pupil = new Mesh(new T.SphereGeometry(0.05, 16, 12), new T.MeshBasicMaterial({ color: 0x0f0a1f }));
    pupil.scale.set(1, 1.1, 0.5); pupil.position.z = 0.03; eg.add(pupil);
    var shine = new Mesh(new T.SphereGeometry(0.02, 10, 8), new T.MeshBasicMaterial({ color: 0xffffff }));
    shine.position.set(0.026, 0.034, 0.058); eg.add(shine);
    var blush = new Mesh(new T.CircleGeometry(0.07, 20), new T.MeshBasicMaterial({ color: 0xf2aab9, transparent: true, opacity: 0.4, depthWrite: false }));
    var bd = new Vector3(side * 0.82, -0.28, 0.5).normalize();
    blush.position.copy(bd).multiplyScalar(0.415);
    blush.quaternion.setFromUnitVectors(new Vector3(0, 0, 1), bd);
    head.add(blush); head.add(eg); eyes.push(eg);
  });

  // beak
  var upperG = new T.ConeGeometry(0.075, 0.26, 16); upperG.rotateX(Math.PI / 2); upperG.scale(1, 0.62, 1);
  var upper = new Mesh(upperG, new T.MeshStandardMaterial({ color: 0xf0b13a, roughness: 0.45 })); upper.position.set(0, -0.015, 0.45); head.add(upper);
  var lowerPivot = new Group(); lowerPivot.position.set(0, -0.055, 0.36); head.add(lowerPivot);
  var lowerG = new T.ConeGeometry(0.06, 0.2, 16); lowerG.rotateX(Math.PI / 2); lowerG.scale(1, 0.5, 1); lowerG.translate(0, 0, 0.1);
  lowerPivot.add(new Mesh(lowerG, new T.MeshStandardMaterial({ color: 0xe19f2e, roughness: 0.5 })));
  var mouthG = new T.SphereGeometry(0.05, 12, 10); mouthG.scale(1, 0.4, 1.6);
  var mouth = new Mesh(mouthG, new T.MeshBasicMaterial({ color: 0x8f2f44 })); mouth.position.set(0, 0.0, 0.07); lowerPivot.add(mouth);

  // feet (tucked under the belly, toes curled)
  var darkMat = new T.MeshStandardMaterial({ color: 0x2b2c36, roughness: 0.55 });
  var toeG = new T.CylinderGeometry(0.022, 0.032, 0.2, 8); toeG.rotateX(Math.PI / 2); toeG.translate(0, 0, 0.1);
  var clawG = new T.ConeGeometry(0.03, 0.1, 8); clawG.rotateX(Math.PI / 2); clawG.translate(0, 0, 0.245);
  [-1, 1].forEach(function (side) {
    var foot = new Group(); foot.position.set(side * 0.2, -0.5, 0.14); bird.add(foot);
    [-0.38, 0, 0.38].forEach(function (a) {
      var tp = new Group(); tp.rotation.y = a; tp.rotation.x = 0.8;
      tp.add(new Mesh(toeG, darkMat)); tp.add(new Mesh(clawG, darkMat));
      foot.add(tp);
    });
    var back = new Group(); back.rotation.y = Math.PI;
    var bt = new Mesh(toeG, darkMat); bt.scale.set(1, 1, 0.55); back.add(bt); foot.add(back);
  });

  /* ---- wings ---- */
  var PRIM = [
    [0.10, 0.62, 1.45, 1.0, '#4b4f6c'], [0.20, 0.56, 1.62, 0.95, '#50546f'], [0.30, 0.50, 1.70, 0.9, '#565a75'],
    [0.41, 0.44, 1.72, 0.8, '#5f6380'], [0.52, 0.38, 1.66, 0.7, '#6a6e8b'], [0.63, 0.32, 1.58, 0.6, '#767a96'],
    [0.75, 0.26, 1.48, 0.5, '#8588a3'], [0.87, 0.20, 1.36, 0.4, '#9598b2'], [0.99, 0.14, 1.24, 0.3, '#a5a8c0'],
    [1.10, 0.08, 1.12, 0.2, '#b3b6cc']
  ];
  var FLIGHT_BASE = col('#f4f3fc');

  function buildWing(mirrored) {
    var mirror = new Group(); if (mirrored) mirror.scale.x = -1;
    var shoulder = new Group(); shoulder.position.set(0.34, 0.22, 0.1);
    var flap = new Group();
    mirror.add(shoulder); shoulder.add(flap);
    var items = [];
    function feather(o) {
      var pivot = new Group(); pivot.position.set(o.rx, o.layer * 0.012 + o.i * 0.0016, 0);
      pivot.rotation.y = o.theta;
      var fm = new Group(); fm.rotation.x = -Math.PI / 2;
      var geo = featherGeo(o.L, o.W, o.round, o.c0, o.c1, o.t0, o.t1);
      fm.add(new Mesh(geo, featherMat));
      if (o.glow) { var gm = new Mesh(geo, rimMat); gm.scale.set(1.03, 1.25, 1); gm.position.z = -0.007; fm.add(gm); }
      pivot.add(fm); flap.add(pivot);
      var it = { pivot: pivot, fm: fm, outer: o.outer, i: o.i };
      items.push(it); return it;
    }
    var armG = new T.SphereGeometry(1, 16, 12); armG.scale(0.55, 0.075, 0.12); armG.translate(0.42, 0.0, 0.0);
    flap.add(new Mesh(armG, new T.MeshStandardMaterial({ color: 0xf2f1fa, roughness: 0.9 })));

    PRIM.forEach(function (p, i) {
      feather({ theta: p[0], rx: p[1], L: p[2], W: i < 3 ? 0.22 : 0.27, round: -0.2, c0: FLIGHT_BASE, c1: col(p[4]), t0: 0.3, t1: 0.92, layer: 0, outer: p[3], i: i, glow: i < 7 });
    });
    PRIM.forEach(function (p, i) {
      var L1 = p[2] * 0.62;
      var it = feather({ theta: p[0], rx: p[1], L: L1, W: 0.3, round: 0.9, c0: col('#fcfcff'), c1: col('#dedff2'), t0: 0.2, t1: 1, layer: 1, outer: p[3] * 0.8, i: i });
      if (i === 4) addDiamond(it.fm, L1 * 0.74, 0, 1.9, 1.25);
    });
    for (var j = 0; j < 8; j++) {
      var p2 = PRIM[j];
      feather({ theta: p2[0] + 0.05, rx: p2[1], L: 0.36 * p2[2] + 0.05, W: 0.27, round: 1, c0: col('#fdfdff'), c1: col('#ecebf8'), t0: 0.2, t1: 1, layer: 2, outer: p2[3] * 0.5, i: j });
    }
    for (var q = 0; q < 6; q++) {
      feather({ theta: q * 0.24, rx: 0.02 + q * 0.01, L: 0.36, W: 0.26, round: 1, c0: col('#fdfcff'), c1: col('#efe7f0'), t0: 0.2, t1: 1, layer: 3, outer: 0.1, i: q });
    }
    return { mirror: mirror, flap: flap, items: items };
  }
  var wings = [buildWing(false), buildWing(true)];
  wings.forEach(function (w) { bird.add(w.mirror); });

  /* ---- tail ---- */
  var tailRoot = new Group(); tailRoot.position.set(0, 0.02, -0.55); bird.add(tailRoot);
  var tailItems = [];
  (function () {
    var N = 9;
    for (var i = 0; i < N; i++) {
      var t = i / (N - 1), edge = Math.abs(t - 0.5) * 2;
      var L = 1.6 - 0.55 * Math.pow(edge, 1.5), phi = (t - 0.5) * 1.1;
      var pivot = new Group(); pivot.position.y = (1 - edge) * 0.02;
      pivot.rotation.y = Math.PI / 2 + phi;
      var fm = new Group(); fm.rotation.x = -Math.PI / 2;
      var geo = featherGeo(L, 0.25, -0.1, col('#f4f3fc'), col(edge < 0.5 ? '#4e526e' : '#7c809c'), 0.3, 0.95);
      fm.add(new Mesh(geo, featherMat));
      var gm = new Mesh(geo, rimMat); gm.scale.set(1.03, 1.25, 1); gm.position.z = -0.007; fm.add(gm);
      if (i === 4) addDiamond(fm, L * 0.6, 0, 1.9, 1.25);
      if (i === 2 || i === 6) addDiamond(fm, L * 0.68, 0, 1.2, 0.8);
      pivot.add(fm); tailRoot.add(pivot);
      tailItems.push({ pivot: pivot, i: i });
    }
  })();

  var blueLight = new T.PointLight(0x7fbfff, 0.9, 6); blueLight.position.set(0, 0.2, 0.4); bird.add(blueLight);

  /* ================= animation ================= */
  var FLAP = { amp: 0.42, base: 0.8, hz: 1.35, pitch: -0.3, tailPitch: -0.32, bob: 0.16, roll: 0.1, mouth: 0.55 };
  var phase = 0, time = 0, blinkT = 2.5, blink = 0, chirpClock = 0;

  function update(dt) {
    time += dt;
    phase += dt * TAU * FLAP.hz * speed;
    var sp = Math.sin(phase), cp = Math.cos(phase);

    spriteMat.opacity = Math.min(1, 0.85 * glow);
    rimMat.opacity = 0.3 * glow;
    diamondMat.opacity = Math.min(1, 0.35 + 0.65 * glow);
    diamondFillMat.opacity = 0.3 * glow;
    blueLight.intensity = (0.8 + 0.25 * Math.sin(time * 2)) * glow;

    var ang = FLAP.base + FLAP.amp * sp;
    for (var w = 0; w < wings.length; w++) {
      var wing = wings[w];
      wing.flap.rotation.z = ang;
      for (var i = 0; i < wing.items.length; i++) {
        var it = wing.items[i];
        var fl = Math.sin(time * 3 + it.i * 0.7 + w) * 0.015 * it.outer;
        it.pivot.rotation.z = -0.22 * it.outer * FLAP.amp * cp + fl;
        it.fm.rotation.x = -Math.PI / 2 + 0.1 * it.outer * FLAP.amp * cp + fl * 0.6;
      }
    }
    tailRoot.rotation.x = FLAP.tailPitch + 0.06 * sp;
    for (var t = 0; t < tailItems.length; t++) {
      tailItems[t].pivot.rotation.z = Math.sin(time * 2.2 + tailItems[t].i * 0.6) * 0.03;
    }

    head.rotation.x = -0.05 + 0.03 * Math.sin(time * 1.3);
    blinkT -= dt;
    if (blinkT < 0) { blink = 0.14; blinkT = rand(2.5, 5); }
    if (blink > 0) blink -= dt;
    var eyeY = blink > 0 ? 0.12 : 1;
    eyes.forEach(function (e) { e.scale.y += (eyeY - e.scale.y) * 0.6; });
    var pulse = 0;
    if (chirpClock > 0) { chirpClock -= dt; var el = 0.5 - Math.max(0, chirpClock); pulse = 0.5 - 0.5 * Math.cos(el / 0.16 * TAU); }
    lowerPivot.rotation.x = 0.04 + 0.5 * Math.max(FLAP.mouth, pulse);

    bird.position.y = FLAP.bob * (-cp) * 0.5 + 0.05 * pulse;
    bird.rotation.x = FLAP.pitch + 0.04 * sp;
    bird.rotation.z = FLAP.roll * Math.sin(time * 0.7);
  }

  return {
    group: group,
    update: update,
    setSpeed: function (v) { speed = v; },
    setGlow: function (v) { glow = v; },
    openBeak: function () { chirpClock = 0.5; }
  };
}

/* =====================================================================
   DEMO SCENE  (delete this part when you move the bird into your game)
   ===================================================================== */
(function () {
  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);

  // a good light setup for the bird
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8f95c6, 0.5));
  var key = new THREE.DirectionalLight(0xfff3e6, 0.6); key.position.set(3.5, 5, 4); scene.add(key);
  var rim = new THREE.DirectionalLight(0x9cd2ff, 0.7); rim.position.set(-4, 2.5, -3.5); scene.add(rim);
  var fill = new THREE.DirectionalLight(0xffffff, 0.22); fill.position.set(-3, -1, 3); scene.add(fill);

  var bird = createFrostwing(THREE, { flapSpeed: 1, glow: 1 });
  scene.add(bird.group);

  camera.position.set(4.2, 2.4, 4.4);
  var controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 0.2, 0);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.1;

  function resize() {
    var w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // pull the camera back on narrow screens so the wings fit
    camera.fov = w / h < 1 ? 36 + (1 - w / h) * 26 : 36;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    bird.update(dt);
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
